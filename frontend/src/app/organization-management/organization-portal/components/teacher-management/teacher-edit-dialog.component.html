<div class="dialog-container">
  <h2 mat-dialog-title>{{ title }}</h2>

  @if (loading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <div mat-dialog-content>
    <form>
      <!-- 姓名 -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>姓名 <span class="required">*</span></mat-label>
        <input matInput [(ngModel)]="formData.name" name="name" required />
      </mat-form-field>

      <!-- 邮箱 -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>邮箱 <span class="required">*</span></mat-label>
        <input matInput [(ngModel)]="formData.email" name="email" type="email" required />
      </mat-form-field>

      <!-- 电话 -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>电话</mat-label>
        <input matInput [(ngModel)]="formData.phone" name="phone" type="tel" />
      </mat-form-field>

      <!-- 部门 -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>部门 <span class="required">*</span></mat-label>
        <mat-select [(ngModel)]="formData.department" name="department" required>
          @for (dept of departments; track dept) {
            <mat-option [value]="dept">{{ dept }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <!-- 职位 -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>职位</mat-label>
        <input matInput [(ngModel)]="formData.position" name="position" />
      </mat-form-field>

      <!-- 入职日期 -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>入职日期</mat-label>
        <input matInput [(ngModel)]="formData.hireDate" name="hireDate" type="date" />
      </mat-form-field>

      <!-- 状态（仅编辑模式） -->
      @if (isEditMode) {
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>状态</mat-label>
          <mat-select [(ngModel)]="formData.status" name="status">
            @for (option of statusOptions; track option) {
              <mat-option [value]="option.value">{{ option.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      }

      <!-- 个人简介 -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>个人简介</mat-label>
        <textarea matInput [(ngModel)]="formData.bio" name="bio" rows="4"></textarea>
      </mat-form-field>
    </form>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" [disabled]="loading">
      取消
    </button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="loading">
      @if (loading) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        {{ isEditMode ? '保存' : '添加' }}
      }
    </button>
  </div>
</div>
