# ============================================================
# OpenMT 后端 - Supervisor 配置（非容器化部署备选方案
#
# 安装 Supervisor：
#   Ubuntu/Debian: sudo apt-get install -y supervisor
#   CentOS/RHEL  : sudo yum install -y supervisor
#
# 拷贝文件：
#   sudo cp deploy/supervisor/openmt-api.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread
#   sudo supervisorctl update
#
# 管理命令：
#   sudo supervisorctl status openmt-api
#   sudo supervisorctl tail -f openmt-api
#   sudo supervisorctl restart openmt-api
# ============================================================

[program:openmt-api]
command     = /opt/openmt/backend/.venv/bin/gunicorn main:app
            --workers 4
            --worker-class uvicorn.workers.UvicornWorker
            --bind 127.0.0.1:8000
            --log-level info
            --access-logfile /var/log/openmt/access.log
            --error-logfile /var/log/openmt/error.log
directory   = /opt/openmt/backend
user        = www-data
autostart   = true
autorestart = true
startsecs  = 5
startretries = 3
stopsignal = TERM
stopwaitsecs = 30
killasgroup = true
redirect_stderr = false

# 环境变量（生产密钥放到这里；注意权限 600）
environment=
    ENV="prod",
    DATABASE_URL="postgresql://openmt_user:CHANGE_ME_PASSWORD@localhost:5432/openmt_edu_inst",
    SECRET_KEY="CHANGE_ME_LONG_RANDOM_STRING",
    ACCESS_TOKEN_EXPIRE_MINUTES=30,
    REDIS_URL="redis://127.0.0.1:6379/0",
    CORS_ALLOW_ORIGINS="https://app.yourschool.com",
    ENFORCE_HTTPS=1,
    DEMO_MODE=0
