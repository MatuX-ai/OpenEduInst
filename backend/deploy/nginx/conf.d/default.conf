# ============================================================
# 生产环境：HTTPS + HTTP->HTTPS 重定向
#
# 需要把以下文件放到 /etc/nginx/ssl/ 下：
#   cert.pem  -> 证书链（包含 fullchain）
#   privkey.pem -> 私钥
#
# 推荐使用 Let's Encrypt / certbot 免费申请：
#   sudo certbot certonly --webroot -w /var/www/certbot -d your-domain.com
# ============================================================

# ---- HTTP 80：重定向到 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 443：主站点 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL 基本设置（Modern 配置：TLS 1.2+）
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头（HSTS 会强制浏览器走 HTTPS 1 年；首次上线建议先设 60s 测试）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 前端静态资源（由 Angular build 产物）
    # 示例：把 dist/* 拷到 /var/www/openmt/ 下即可
    location / {
        root   /var/www/openmt;
        index  index.html;
        # Angular 的 html5mode：找不到文件时回退到 index.html
        try_files $uri $uri/ /index.html;

        # 静态资源长缓存（Angular 产物带 hash，可放心长期缓存）
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|mp4|mp3)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---- API 反向代理到 FastAPI ----
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 让后端响应里的头透传到客户端
        proxy_pass_header   Set-Cookie;

        # 允许跨域（最终策略由后端 CORSMiddleware 决定）
        proxy_pass_header   Access-Control-Allow-Origin;
    }

    # ---- 健康检查公开路径 ----
    location = /health {
        proxy_pass http://api:8000/health;
    }

    # ---- OpenAPI 文档（内部可选暴露） ----
    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # 拒绝访问 . 开头的敏感文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}
