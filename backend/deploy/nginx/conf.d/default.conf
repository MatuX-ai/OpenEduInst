# ============================================================
# 生产环境：HTTPS + HTTP->HTTPS 重定向
#
# 路由规划：
#   /                  -> 营销站 (Next.js)
#   /app               -> 管理后台 (Angular SPA)
#   /api/auth/*        -> 营销站 API 代理 (转发到 FastAPI)
#   /api/organizations/* -> 营销站 API 代理
#   /api/*             -> FastAPI 后端
# ============================================================

# ---- HTTP 80：重定向到 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 443：主站点 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL 基本设置（Modern 配置：TLS 1.2+）
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- 营销站 API 代理（必须在 /api/ 之前，精确匹配优先） ----
    location /api/auth/ {
        proxy_pass         http://marketing:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/organizations/ {
        proxy_pass         http://marketing:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket 专用代理（长连接超时 1h）----
    location /api/v1/ws/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ---- FastAPI 后端 API ----
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_pass_header   Set-Cookie;
        proxy_pass_header   Access-Control-Allow-Origin;
    }

    # ---- 管理后台 (Angular SPA) ----
    location /app {
        alias /var/www/openmt;
        try_files $uri /app/index.html;

        # 静态资源长缓存
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|mp4|mp3)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---- 健康检查 / OpenAPI 文档 ----
    location = /health {
        proxy_pass http://api:8000/health;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    # 拒绝访问 . 开头的敏感文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---- 营销站首页 (Next.js standalone) ----
    # 必须放在最后，作为 catch-all
    location / {
        proxy_pass         http://marketing:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
