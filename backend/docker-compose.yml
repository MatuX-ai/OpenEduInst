# ============================================================
# OpenMT 机构管理系统 - docker-compose.yml
#
# 服务构成：
#   api     -> FastAPI 后端 (端口 8000)
#   nginx   -> 反向代理 + HTTPS 终止 + 静态资源 (端口 80/443)
#   redis   -> 限流/缓存 (端口 6379)
#   postgres -> 本地 PostgreSQL（仅在 COMPOSE_PROFILES=with-db 时启动）
#
# 使用说明：
#   1) 生产环境：把 DATABASE_URL 指向 Neon/外部 Postgres，忽略 postgres 服务
#   2) 本地联调：export COMPOSE_PROFILES=with-db，一键启动完整四件套
#
# 启动命令：
#   docker compose up -d --build
# 查看日志：
#   docker compose logs -f --tail=200
# ============================================================

# ---- 给 celery worker/beat 启动脚本，复用 api 镜像即可 -----
x-api-env: &api-env
  ENV: prod
  DATABASE_URL: ${DATABASE_URL:-postgresql://openmt_user:change_me_password@postgres:5432/openmt_edu_inst?sslmode=disable}
  SECRET_KEY: ${SECRET_KEY:-please-change-me-to-a-long-random-string}
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:4200}
  ENFORCE_HTTPS: ${ENFORCE_HTTPS:-1}
  DEMO_MODE: ${DEMO_MODE:-0}
  RL_ANON_LIMIT: ${RL_ANON_LIMIT:-60}
  RL_AUTH_LIMIT: ${RL_AUTH_LIMIT:-600}
  RL_LOGIN_LIMIT: ${RL_LOGIN_LIMIT:-10}
  WORKERS: ${WORKERS:-4}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  IMATU_SECRET_KEY: ${IMATU_SECRET_KEY:-}
  OPENSCIEDU_API_KEY: ${OPENSCIEDU_API_KEY:-}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  CELERY_ENABLED: "1"

services:
  # ----------------------------------------------------------
  # 1. 后端 FastAPI 服务
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openmt-api
    restart: unless-stopped
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # 2. Celery Worker（定时/异步任务执行器）
  # ----------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openmt-celery-worker
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
    command: >
      sh -c "celery -A tasks.celery_app worker
             --loglevel=$LOG_LEVEL --concurrency=2 --without-heartbeat --without-mingle"

  # ----------------------------------------------------------
  # 3. Celery Beat（定时任务调度器，全集群只允许 1 个）
  # ----------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openmt-celery-beat
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - redis
    command: >
      sh -c "celery -A tasks.celery_app beat --loglevel=$LOG_LEVEL --pidfile=/app/data/celerybeat.pid"

  # ----------------------------------------------------------
  # 4. Nginx 反向代理
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: openmt-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书（生产环境：把 cert.pem / privkey.pem 放到 deploy/nginx/ssl/ 目录
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      # 前端静态文件
      - ./deploy/frontend:/var/www/openmt:ro
      - ./logs/nginx:/var/log/nginx

  # ----------------------------------------------------------
  # 5. Redis（限流/缓存 / Celery Broker）
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: openmt-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------
  # 6. PostgreSQL（可选；本地联调用，生产推荐 Neon/云数据库
  #     启动: COMPOSE_PROFILES=with-db docker compose up -d
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: openmt-postgres
    profiles: ["with-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: openmt_edu_inst
      POSTGRES_USER: openmt_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmt_user -d openmt_edu_inst"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pg_data:
